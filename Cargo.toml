[package]
name = "hushup"
version = "0.2.0"
edition = "2021"
description = "Stop OS updates and silence the \"update available\" nags"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[profile.release]
strip = true
lto = true
